name: Windows installer

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a signed installer Release after clean-VM acceptance
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF -match '^refs/tags/v(.+)$') { $Matches[1] } else { '0.2.0-ci' }
          .\installer\windows\build-installer.ps1 -Version $version

      - name: Create checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem .\installer\windows\dist\ResearchOS-Setup-*.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer EXE was not produced.' }
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ASCII .\installer\windows\dist\SHA256SUMS.txt

      - name: Sign installer for an explicit publish
        if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'workflow_dispatch' && inputs.publish == true
        shell: pwsh
        env:
          INSTALLER_SIGNING_CERT_PFX_B64: ${{ secrets.INSTALLER_SIGNING_CERT_PFX_B64 }}
          INSTALLER_SIGNING_CERT_PASSWORD: ${{ secrets.INSTALLER_SIGNING_CERT_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:INSTALLER_SIGNING_CERT_PFX_B64) -or [string]::IsNullOrWhiteSpace($env:INSTALLER_SIGNING_CERT_PASSWORD)) {
            throw 'Publishing requires INSTALLER_SIGNING_CERT_PFX_B64 and INSTALLER_SIGNING_CERT_PASSWORD repository secrets.'
          }
          $installer = Get-ChildItem .\installer\windows\dist\ResearchOS-Setup-*.exe | Select-Object -First 1
          $pfx = Join-Path $env:RUNNER_TEMP 'research-os-installer-signing.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:INSTALLER_SIGNING_CERT_PFX_B64))
          $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Filter signtool.exe -Recurse -ErrorAction SilentlyContinue | Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $signTool) { throw 'Windows SDK signtool.exe is required for a signed publish.' }
          & $signTool.FullName sign /fd SHA256 /f $pfx /p $env:INSTALLER_SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 $installer.FullName
          if ($LASTEXITCODE -ne 0) { throw 'Authenticode signing failed.' }
          $signature = Get-AuthenticodeSignature -LiteralPath $installer.FullName
          if ($signature.Status -ne 'Valid') { throw "Signed installer verification failed: $($signature.Status)" }
          Remove-Item -LiteralPath $pfx -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $installer.FullName).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -Encoding ASCII .\installer\windows\dist\SHA256SUMS.txt

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-os-windows-installer
          path: installer/windows/dist/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: ${{ github.event_name != 'workflow_dispatch' || inputs.publish != true }}
          generate_release_notes: true
          files: |
            installer/windows/dist/*.exe
            installer/windows/dist/SHA256SUMS.txt
          body: |
            This Release was created by the gated Windows installer workflow. A published Release requires the explicit signed-release path and clean Windows VM acceptance documented in P2-INSTALLER-029.
