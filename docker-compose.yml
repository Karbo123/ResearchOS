name: research-os

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${API_DB_USER:-research_api}:${API_DB_PASSWORD:-api-development-password}@postgres:5432/${POSTGRES_DB:-research_os}
  RUNNER_URL: http://runner:8010
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
  MINIO_SECURE: "false"
  PROJECTS_ROOT: /workspace/projects
  ARTIFACTS_ROOT: /workspace/artifacts
  RESEARCH_LLM_PROVIDER: ${RESEARCH_LLM_PROVIDER:-openai}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  MODEL_SETTINGS_PATH: /workspace/runtime/model-settings.json
  MODEL_REQUEST_TIMEOUT_SECONDS: ${MODEL_REQUEST_TIMEOUT_SECONDS:-240}
  RESEARCH_MODEL_SIMPLE: ${RESEARCH_MODEL_SIMPLE:-gpt-5.6-luna}
  RESEARCH_MODEL_URL_SIMPLE: ${RESEARCH_MODEL_URL_SIMPLE:-}
  RESEARCH_MODEL_KEY_SIMPLE: ${RESEARCH_MODEL_KEY_SIMPLE:-}
  RESEARCH_REASONING_SIMPLE: ${RESEARCH_REASONING_SIMPLE:-low}
  RESEARCH_MODEL_MEDIUM: ${RESEARCH_MODEL_MEDIUM:-gpt-5.6-terra}
  RESEARCH_MODEL_URL_MEDIUM: ${RESEARCH_MODEL_URL_MEDIUM:-}
  RESEARCH_MODEL_KEY_MEDIUM: ${RESEARCH_MODEL_KEY_MEDIUM:-}
  RESEARCH_REASONING_MEDIUM: ${RESEARCH_REASONING_MEDIUM:-medium}
  RESEARCH_MODEL_COMPLEX: ${RESEARCH_MODEL_COMPLEX:-gpt-5.6-sol}
  RESEARCH_MODEL_URL_COMPLEX: ${RESEARCH_MODEL_URL_COMPLEX:-}
  RESEARCH_MODEL_KEY_COMPLEX: ${RESEARCH_MODEL_KEY_COMPLEX:-}
  RESEARCH_REASONING_COMPLEX: ${RESEARCH_REASONING_COMPLEX:-high}
  RESEARCH_ROUTER_SIMPLE_MAX: ${RESEARCH_ROUTER_SIMPLE_MAX:-2}
  RESEARCH_ROUTER_MEDIUM_MAX: ${RESEARCH_ROUTER_MEDIUM_MAX:-7}
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GITLAB_TOKEN: ${GITLAB_TOKEN:-}
  SEMANTIC_SCHOLAR_API_KEY: ${SEMANTIC_SCHOLAR_API_KEY:-}
  REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Shanghai}
  REPORT_NOTIFICATIONS_ENABLED: ${REPORT_NOTIFICATIONS_ENABLED:-false}
  REPORT_WEBHOOK_URL: ${REPORT_WEBHOOK_URL:-}
  REPORT_WEBHOOK_SECRET: ${REPORT_WEBHOOK_SECRET:-}
  REPORT_WEBHOOK_TIMEOUT_SECONDS: ${REPORT_WEBHOOK_TIMEOUT_SECONDS:-15}
  N8N_INTERNAL_URL: http://n8n:5678
  CLAMAV_HOST: clamav
  CLAMAV_PORT: 3310
  MALWARE_SCAN_TIMEOUT_SECONDS: ${MALWARE_SCAN_TIMEOUT_SECONDS:-30}
  MATERIAL_MAX_FILE_BYTES: ${MATERIAL_MAX_FILE_BYTES:-52428800}
  MATERIAL_MAX_SESSION_FILES: ${MATERIAL_MAX_SESSION_FILES:-50}
  MATERIAL_MAX_SESSION_BYTES: ${MATERIAL_MAX_SESSION_BYTES:-262144000}
  MATERIAL_MAX_PROJECT_FILES: ${MATERIAL_MAX_PROJECT_FILES:-200}
  MATERIAL_MAX_PROJECT_BYTES: ${MATERIAL_MAX_PROJECT_BYTES:-2147483648}
  N8N_PUBLIC_URL: http://127.0.0.1:5678
  N8N_LOCAL_OWNER_EMAIL: ${N8N_LOCAL_OWNER_EMAIL:-local-owner@research-os.invalid}
  N8N_LOCAL_OWNER_PASSWORD: ${N8N_LOCAL_OWNER_PASSWORD:-local-development-password-change-me}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-research_os}
      POSTGRES_USER: ${POSTGRES_USER:-research}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-research-dev}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./infra/postgres/mlflow-database.sql:/docker-entrypoint-initdb.d/002-mlflow-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-research} -d ${POSTGRES_DB:-research_os}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  db-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    working_dir: /workspace
    environment:
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research}:${POSTGRES_PASSWORD:-research-dev}@postgres:5432/${POSTGRES_DB:-research_os}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-research}:${POSTGRES_PASSWORD:-research-dev}@postgres:5432/${POSTGRES_DB:-research_os}
      API_DB_USER: ${API_DB_USER:-research_api}
      API_DB_PASSWORD: ${API_DB_PASSWORD:-api-development-password}
      N8N_DB_USER: ${N8N_DB_USER:-research_n8n}
      N8N_DB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-development-password}
      MLFLOW_DB_USER: ${MLFLOW_DB_USER:-research_mlflow}
      MLFLOW_DB_PASSWORD: ${MLFLOW_DB_PASSWORD:-mlflow-development-password}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "python scripts/provision_db_roles.py && alembic -c /workspace/alembic.ini upgrade head"]
    networks:
      - default
    restart: "no"

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001"
    restart: unless-stopped

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; do sleep 2; done
        mc mb --ignore-existing local/research-artifacts
        mc anonymous set none local/research-artifacts
    restart: "no"

  clamav:
    image: clamav/clamav:1.4.3
    networks:
      - default
    healthcheck:
      test: ["CMD-SHELL", "clamdscan --ping 2 >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 120s
    restart: unless-stopped

  mlflow:
    build: ./apps/mlflow
    command: >-
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri postgresql+psycopg2://${MLFLOW_DB_USER:-research_mlflow}:${MLFLOW_DB_PASSWORD:-mlflow-development-password}@postgres:5432/research_os_mlflow
      --artifacts-destination s3://research-artifacts/mlflow
      --serve-artifacts
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-minioadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:5000:5000"
    networks:
      - default
      - runner-internal
    restart: unless-stopped

  runner-launcher:
    build:
      context: ./apps/runner-launcher
    environment:
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-runner-dev-secret}
      RUNNER_JOB_IMAGE: research-os-runner
      RUNNER_CONTAINER_NAME: research-os-runner
      RUNNER_NETWORK: research-os-runner-internal
      MLFLOW_TRACKING_URI: http://mlflow:5000
      RUNNER_IMAGE_DIGEST: ${RUNNER_IMAGE_DIGEST:-unavailable}
      RESEARCH_OS_COMMIT: ${RESEARCH_OS_COMMIT:-unavailable}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    # The launcher is the sole Docker-control boundary; Runner and API have no socket.
    user: "0:0"
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    depends_on:
      mlflow:
        condition: service_started
    networks:
      - runner-internal
    restart: unless-stopped

  runner:
    container_name: research-os-runner
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    environment:
      <<: *app-env
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-runner-dev-secret}
      RUNNER_MAX_SECONDS: ${RUNNER_MAX_SECONDS:-600}
      RUNNER_EXECUTOR_URL: http://runner-launcher:8020
      RUNNER_EXECUTOR_TIMEOUT_SECONDS: ${RUNNER_EXECUTOR_TIMEOUT_SECONDS:-15}
      RUNNER_IMAGE_DIGEST: ${RUNNER_IMAGE_DIGEST:-unavailable}
      RESEARCH_OS_COMMIT: ${RESEARCH_OS_COMMIT:-unavailable}
      MPLCONFIGDIR: /tmp/matplotlib
      XDG_CACHE_HOME: /tmp/cache
    volumes:
      - ./projects:/workspace/projects:ro
      - ./artifacts:/workspace/artifacts
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: ["ALL"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    depends_on:
      mlflow:
        condition: service_started
      runner-launcher:
        condition: service_started
    networks:
      - runner-internal
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *app-env
      RUNNER_SHARED_SECRET: ${RUNNER_SHARED_SECRET:-runner-dev-secret}
      RESEARCH_OS_COMMIT: ${RESEARCH_OS_COMMIT:-unavailable}
    volumes:
      - ./projects:/workspace/projects
      - ./artifacts:/workspace/artifacts
      - ./runtime:/workspace/runtime
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      runner:
        condition: service_started
    networks:
      - default
      - runner-internal
    restart: unless-stopped

  queue-worker:
    image: research-os-api
    working_dir: /workspace/apps/api
    command: ["python", "-m", "app.queue_worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://${API_DB_USER:-research_api}:${API_DB_PASSWORD:-api-development-password}@postgres:5432/${POSTGRES_DB:-research_os}
      N8N_RESEARCH_WEBHOOK_URL: http://n8n:5678/webhook/research-os/start
      QUEUE_POLL_SECONDS: ${QUEUE_POLL_SECONDS:-2}
      QUEUE_LEASE_SECONDS: ${QUEUE_LEASE_SECONDS:-180}
      QUEUE_WORKFLOW_TIMEOUT_SECONDS: ${QUEUE_WORKFLOW_TIMEOUT_SECONDS:-90}
      QUEUE_RETRY_BASE_SECONDS: ${QUEUE_RETRY_BASE_SECONDS:-5}
      QUEUE_RETRY_MAX_SECONDS: ${QUEUE_RETRY_MAX_SECONDS:-300}
    depends_on:
      api:
        condition: service_started
      n8n:
        condition: service_started
    networks:
      - default
    restart: unless-stopped

  n8n:
    image: n8nio/n8n:1.121.0
    entrypoint:
      - /bin/sh
      - -c
      - |
        n8n import:workflow --input=/workflows/research-main.json || true
        n8n import:workflow --input=/workflows/supervision-report.json || true
        n8n import:workflow --input=/workflows/chat-gateway.json || true
        n8n update:workflow --id=research-os-main --active=true
        n8n update:workflow --id=research-os-reports --active=true
        n8n update:workflow --id=research-os-chat --active=true
        exec n8n start
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-research_os}
      DB_POSTGRESDB_USER: ${N8N_DB_USER:-research_n8n}
      DB_POSTGRESDB_PASSWORD: ${N8N_DB_PASSWORD:-n8n-development-password}
      DB_POSTGRESDB_SCHEMA: n8n
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:-local-development-only-key}
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_GIT_NODE_DISABLE_BARE_REPOS: "true"
      N8N_RUNNERS_ENABLED: "true"
      GENERIC_TIMEZONE: ${REPORT_TIMEZONE:-Asia/Shanghai}
    volumes:
      - n8n-data:/home/node/.n8n
      - ./n8n/workflows:/workflows:ro
    ports:
      - "127.0.0.1:5678:5678"
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  postgres-data:
  minio-data:
  n8n-data:

networks:
  runner-internal:
    name: research-os-runner-internal
    internal: true
